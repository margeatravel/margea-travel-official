name: Unpack media

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download media zips from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/media
          gh release download media-upload --repo ${{ github.repository }} --pattern 'media-*.zip' --dir /tmp/media
          ls -la /tmp/media
      - name: Unzip into public/
        run: |
          for z in /tmp/media/media-*.zip; do
            echo "Unzipping $z"
            unzip -o -q "$z" -d public/
          done
          echo "public/ now has $(find public -type f | wc -l) files"
      - name: Commit media
        run: |
          git config user.name "margeatravel"
          git config user.email "admin@margeatravel.com"
          git add public/
          git status --short | head -20
          git commit -m "Add media files (photos and videos)" || echo "nothing to commit"
          git push
      - name: Delete the media release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete media-upload --repo ${{ github.repository }} --yes --cleanup-tag
